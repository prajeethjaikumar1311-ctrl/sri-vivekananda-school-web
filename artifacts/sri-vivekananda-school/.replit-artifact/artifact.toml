kind = "web"
previewPath = "/"
title = "Sri Vivekananda School"
description = "The official website for Sri Vivekananda Nursery and Primary School in SKR Nagar, Singarapettai, sharing school information, campus and student life, admissions, and verified contact details."
version = "1.0.0"
id = "artifacts/sri-vivekananda-school"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25804

[services.development]
run = "pnpm --filter @workspace/sri-vivekananda-school run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sri-vivekananda-school", "run", "build" ]
serve = "static"
publicDir = "artifacts/sri-vivekananda-school/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25804"
BASE_PATH = "/"
